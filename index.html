  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--rice);
    color: var(--ink);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .brand .mark {
    font-family: "Bricolage Grotesque", ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: -0.01em;
    color: var(--tea);
  }

  .brand .sub {
    font-size: 0.78rem;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .statbar {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 22px;
  }

  .stat {
    background: var(--nori);
    color: var(--rice);
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
  }

  .stat .n {
    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 1.5rem;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }

  .stat .l {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    opacity: 0.75;
    margin-top: 3px;
  }

  .stat.accent { background: var(--tea); color: var(--tea-ink); }

  nav.tabs {
    display: inline-flex;
    background: var(--rice-2);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 20px;
  }

  nav.tabs button {
    font-family: inherit;
    font-size: 0.86rem;
    font-weight: 700;
    color: var(--ink-soft);
    background: transparent;
    border: none;
    border-radius: 999px;
    padding: 8px 18px;
    cursor: pointer;
  }

  nav.tabs button[aria-selected="true"] {
    background: var(--nori);
    color: var(--rice);
  }

  nav.tabs button:focus-visible { outline: 2px solid var(--tea); outline-offset: 2px; }

  section[hidden] { display: none; }

  /* ---- Orders view ---- */
  .order-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .order-grid[hidden] { display: none; }

  .ticket {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px 18px 18px;
    box-shadow: var(--shadow);
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .ticket .who {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .ticket .who .name {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.25;
  }

  .ticket .who .handle {
    display: block;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.76rem;
    color: var(--ink-soft);
    margin-top: 1px;
  }

  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 4px 9px;
    border-radius: 999px;
    white-space: nowrap;
    flex: none;
  }

  .badge.paid { background: var(--matcha-soft); color: var(--matcha); }
  .badge.unpaid { background: var(--warn-soft); color: var(--warn); }

  .items {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-top: 1px dashed var(--line);
    border-bottom: 1px dashed var(--line);
    padding: 10px 0;
  }

  .items li {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 0.88rem;
  }

  .items li .qty {
    font-family: "Space Mono", monospace;
    color: var(--ink-soft);
    margin-right: 6px;
  }

  .items li .price {
    font-family: "Space Mono", monospace;
    font-variant-numeric: tabular-nums;
    color: var(--ink-soft);
    flex: none;
  }

  .items li .price.comp { color: var(--matcha); }

  .meta-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }

  .pickup {
    font-size: 0.84rem;
  }

  .pickup .d { font-weight: 700; }

  .total {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 1.15rem;
    font-variant-numeric: tabular-nums;
  }

  .pay-method {
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .pay-method b { color: var(--ink); font-weight: 700; }

  .pay-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
    font-size: 0.78rem;
    color: var(--ink-soft);
  }

  .pay-chips {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .pay-chip {
    width: 24px;
    height: 24px;
    border-radius: 7px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    box-shadow: var(--shadow);
  }

  .pay-chip.venmo { background: #3d95ce; }
  .pay-chip.zelle { background: #6d1ed4; }
  .pay-chip.applepay { background: #000; }
  .pay-chip.cash { background: #2f8f5b; }

    font-family: "Space Mono", ui-monospace, monospace;
    font-weight: 700;
    font-size: 0.72rem;
    color: #fff;
    line-height: 1;

    border-radius: 0 8px 8px 0;
    padding: 7px 10px;
    font-size: 0.82rem;
    line-height: 1.35;

  .note b { color: var(--salmon); text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.05em; display: block; margin-bottom: 2px; }

    padding: 30px 10px;
    text-align: center;
    grid-column: 1 / -1;

  .ticket.tg-2 { border-left: 4px solid var(--tg-2); }
  .ticket.tg-3 { border-left: 4px solid var(--tg-3); }
  .ticket.tg-4 { border-left: 4px solid var(--tg-4); }
  .ticket.tg-5 { border-left: 4px solid var(--tg-5); }

  .group-tag {
    align-self: flex-start;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;

  .group-tag.tg-4 { color: var(--tg-4); background: var(--tg-4-bg); }
  .group-tag.tg-5 { color: var(--tg-5); background: var(--tg-5-bg); }

    display: flex;
    justify-content: flex-end;
    margin-top: 2px;
  }

  .toggle {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    user-select: none;
  }

  .toggle input { position: absolute; opacity: 0; width: 0; height: 0; }

  .toggle .track {
    width: 34px;
    height: 20px;
    background: var(--line);
    border-radius: 999px;
    position: relative;
    flex: none;
    transition: background 0.15s ease;
  }

  .toggle .track::after {
    content: "";
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--card);
    box-shadow: var(--shadow);
    transition: transform 0.15s ease;
  }

  .toggle input:checked + .track { background: var(--matcha); }
  .toggle input:checked + .track::after { transform: translateX(14px); }
  .toggle input:focus-visible + .track { outline: 2px solid var(--tea); outline-offset: 2px; }

  .toggle .tlabel {
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--ink-soft);

    align-items: center;
    gap: 14px;

    padding: 5px 12px;
    text-align: center;

    font-size: 1.15rem;

  .portions-badge .l {
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    opacity: 0.85;
  }

  .tally {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);

  .tally-item {
    display: flex;
    align-items: baseline;
    gap: 8px;

  .tally-item .qty {
    font-family: "Space Mono", monospace;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--tea);
    font-variant-numeric: tabular-nums;
  }

  .tally-item .name { font-size: 0.88rem; }

  .roster {
    padding: 6px 20px 14px;
  }

  .roster-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.86rem;
    align-items: baseline;
  }

  .roster-row:last-child { border-bottom: none; }

  .roster-row .who { font-weight: 700; }
  .roster-row .time { font-family: "Space Mono", monospace; color: var(--ink-soft); font-size: 0.8rem; }
  .roster-row .what { color: var(--ink-soft); flex: 1; margin: 0 12px; }

  footer.foot {
    margin-top: 30px;
    font-size: 0.76rem;
    color: var(--ink-soft);
    text-align: center;
  }

  @media (max-width: 640px) {
    .statbar { grid-template-columns: repeat(2, 1fr); }
  }
</style>

      notes: "Drink flavor not chosen yet — confirm at pickup"
    },
    {
      name: "mockingbird_trinket_dollhouse", handle: "mockingbird_trinket_dollhouse",
      items: [
        { qty: 1, name: "Personal Tray", price: 15 },
        { qty: 2, name: "Vietnamese Coffee", price: 4 }
      ],
      total: 23,
      pickupDate: "2026-08-29", pickupTime: "10:00–11:00 AM",
      paid: false, payMethod: "Venmo / Zelle / Apple Pay / cash — at pickup",
      notes: "Never sent a final confirmation \"yes\" in thread — verify before prep"
    },
    {
      name: "Kat", handle: "kat",
      items: [
        { qty: 1, name: "Personal Tray", price: 15 },
        { qty: 1, name: "Green Thai Tea", price: 0, comp: true },
        { qty: 1, name: "Orange Thai Tea", price: 0, comp: true }
      ],
      total: 15,
      pickupDate: "2026-08-29", pickupTime: "1:00 PM",
      paid: false, payMethod: "Venmo / Zelle / Apple Pay / cash — at pickup",
      notes: "No pickup time given in thread — assumed 1:00 PM Sat 8/29 per Tony"
    },
    {
      name: "Christine", handle: "christine",
      items: [
        { qty: 1, name: "Personal Tray", price: 15 },
        { qty: 1, name: "Green Thai Tea", price: 0, comp: true }
      ],
      total: 15,
      pickupDate: "2026-08-30", pickupTime: "11:30 AM",
      paid: false, payMethod: "Venmo / Zelle / Apple Pay / cash — at pickup",
      notes: ""
    }
  ];

  function fmtMoney(n) { return "$" + n.toFixed(2).replace(/\.00$/, ""); }

  function fmtDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", timeZone: "UTC" });
  }

  // Short, unambiguous date like "Thu, Aug 29" — used on order cards so it's
  // never confused with a different week's Thursday.
  function fmtShortDate(iso) {
    const [y, m, d] = iso.split("-").map(Number);
    const dt = new Date(Date.UTC(y, m - 1, d));
    return dt.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", timeZone: "UTC" });
  }

  // Turns "1:00 PM" into minutes-since-midnight so orders can be sorted chronologically.
  function timeToMinutes(t) {
    const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t || "");
    if (!m) return 0;
    let hours = Number(m[1]) % 12;
    if (/pm/i.test(m[3])) hours += 12;
    return hours * 60 + Number(m[2]);
  }

  function ordersByPickup(list) {
    return list.slice().sort((a, b) => {
      if (a.pickupDate !== b.pickupDate) return a.pickupDate.localeCompare(b.pickupDate);
      return timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime);
    });
  }

  // 1 personal tray = 1 portion, 1 shareable tray = 3 portions.
  function trayPortions(items) {
    let personal = 0, shareable = 0;
    for (const i of items) {
      const n = i.name.toLowerCase();
      if (n.includes("shareable tray")) shareable += i.qty;
      else if (n.includes("personal tray")) personal += i.qty;
    }
    return { personal, shareable, portions: personal * 1 + shareable * 3 };
  }

  // ---- Completed-order tracking ----
  // Whether an order's been picked up / fulfilled lives in the viewer's own
  // browser (localStorage), not in the ORDERS array — the dashboard is
  // redeployed fresh each week, so there's no server to store this on. Each
  // order gets a content-based key (not just its position in the array) so a
  // page reload keeps the right orders marked complete, and so last week's
  // completions don't accidentally carry over onto this week's new orders.
  const COMPLETED_STORAGE_KEY = "riceShineCompletedOrders";

  function orderKey(o) {
    return [o.handle, o.pickupDate, o.pickupTime, o.total, o.items.map(i => `${i.qty}x${i.name}`).join(",")].join("|");
  }

  let completedSet = new Set();
  try {
    completedSet = new Set(JSON.parse(localStorage.getItem(COMPLETED_STORAGE_KEY) || "[]"));
  } catch (e) {
    // Private browsing / storage disabled — completion just won't persist across reloads.
  }

  function persistCompleted() {
    try {
      localStorage.setItem(COMPLETED_STORAGE_KEY, JSON.stringify([...completedSet]));
    } catch (e) {}
  }

  function isCompleted(o) {
    return completedSet.has(orderKey(o));
  }

  function toggleCompleted(o) {
    const key = orderKey(o);
    if (completedSet.has(key)) completedSet.delete(key);
    else completedSet.add(key);
    persistCompleted();
  }

  // ---- Same-time grouping ----
  // Orders sharing an exact pickup date + time are the ones being handed
  // over back-to-back, so tag them with a shared color to make that obvious
  // at a glance.
  const GROUP_PALETTE = ["tg-1", "tg-2", "tg-3", "tg-4", "tg-5"];

  function timeGroupKey(o) {
    return `${o.pickupDate}T${o.pickupTime}`;
  }

  function computeTimeGroups(list) {
    const counts = {};
    for (const o of list) counts[timeGroupKey(o)] = (counts[timeGroupKey(o)] || 0) + 1;
    const classes = {};
    let i = 0;
    for (const [key, count] of Object.entries(counts)) {
      if (count > 1) {
        classes[key] = GROUP_PALETTE[i % GROUP_PALETTE.length];
        i++;
      }
    }
    return { classes, counts };
  }

  // ---- Payment method chips ----
  const PAY_ICONS = {
    venmo: { label: "Venmo", cls: "venmo", glyph: "V" },
    zelle: { label: "Zelle", cls: "zelle", glyph: "Z" },
    applepay: {
      label: "Apple Pay", cls: "applepay",
      svg: `<svg viewBox="0 0 16 16" fill="#fff" xmlns="http://www.w3.org/2000/svg">
        <path d="M7.4 4.6c.4-.5.7-1.2.6-1.9-.7 0-1.3.4-1.7.9-.4.5-.7 1.1-.6 1.8.7.1 1.4-.3 1.7-.8z"/>
        <path d="M8.3 5.5c-.9 0-1.6.5-2.1.5s-1.2-.5-2-.5c-1 .1-1.9.6-2.4 1.5-1 1.8-.3 4.5.7 6 .5.7 1.1 1.5 1.9 1.5.7 0 1-.4 1.8-.4s1.1.4 1.8.4c.8 0 1.3-.7 1.8-1.4.6-.8.8-1.6.8-1.6-2-.8-2.3-3.5-.3-4.6-.6-.9-1.5-1.3-2-1.4z"/>
      </svg>`
    },
    cash: { label: "Cash", cls: "cash", glyph: "$" }
  };

  function renderPayMethod(payStr) {
    if (!payStr) return "";
    const [mainPart, note] = payStr.split("—").map(s => s.trim());
    const found = [];
    if (/venmo/i.test(mainPart)) found.push(PAY_ICONS.venmo);
    if (/zelle/i.test(mainPart)) found.push(PAY_ICONS.zelle);
    if (/apple pay/i.test(mainPart)) found.push(PAY_ICONS.applepay);
    if (/\bcash\b/i.test(mainPart)) found.push(PAY_ICONS.cash);

    if (!found.length) {
      return `<div class="pay-row"><span>Payment:</span> <b style="color:var(--ink)">${payStr}</b></div>`;
    }

    const chips = found.map(m => `
      <span class="pay-chip ${m.cls}" title="${m.label}" aria-label="${m.label}">
        ${m.svg ? m.svg : `<span class="glyph">${m.glyph}</span>`}
      </span>
    `).join("");

    return `
      <div class="pay-row">
        <span>Payment:</span>
        <span class="pay-chips">${chips}</span>
        ${note ? `<span class="pay-note">${note}</span>` : ""}
      </div>
    `;
  }

  // ---- Stat bar ----
  // Based on active (not-yet-completed) orders only, so the numbers always
  // reflect what's actually still outstanding.
  function renderStats() {
    const active = ORDERS.filter(o => !isCompleted(o));
    const total = active.length;
    const revenue = active.reduce((s, o) => s + o.total, 0);
    const unpaid = active.filter(o => !o.paid).length;
    const days = [...new Set(active.map(o => o.pickupDate))].sort();
    const nextDay = days[0];
    const el = document.getElementById("statbar");
    el.innerHTML = `
      <div class="stat accent"><div class="n">${total}</div><div class="l">Open orders</div></div>
      <div class="stat"><div class="n">${fmtMoney(revenue)}</div><div class="l">Total value</div></div>
      <div class="stat"><div class="n">${unpaid}</div><div class="l">Awaiting payment</div></div>
      <div class="stat"><div class="n">${nextDay ? fmtShortDate(nextDay) : "—"}</div><div class="l">Next pickup day</div></div>
    `;
  }

  // ---- Orders view ----
  function renderTicket(o, idx, groups) {
    const gk = timeGroupKey(o);
    const gcls = groups.classes[gk];
    const gcount = groups.counts[gk];
    const completed = isCompleted(o);
    return `
      <article class="ticket ${gcls || ""} ${completed ? "is-complete" : ""}">
        <div class="who">
          <div>
            <div class="name">${o.name}</div>
            <span class="handle">@${o.handle}</span>
          </div>
          <span class="badge ${o.paid ? "paid" : "unpaid"}">${o.paid ? "Paid" : "Unpaid"}</span>
        </div>
        <ul class="items">
          ${o.items.map(i => `
            <li>
              <span><span class="qty">${i.qty}×</span>${i.name}${i.note ? ` <span style="color:var(--ink-soft)">(${i.note})</span>` : ""}</span>
              <span class="price ${i.comp ? "comp" : ""}">${i.comp ? "comp" : fmtMoney(i.price)}</span>
            </li>
          `).join("")}
        </ul>
        <div class="meta-row">
          <div class="pickup"><span class="d">${fmtShortDate(o.pickupDate)}</span> · ${o.pickupTime}</div>
          <div class="total">${fmtMoney(o.total)}</div>
        </div>
        ${gcls ? `<div class="group-tag ${gcls}">⏰ Same time as ${gcount - 1} other order${gcount - 1 === 1 ? "" : "s"}</div>` : ""}
        ${renderPayMethod(o.payMethod)}
        ${o.notes ? `<div class="note"><b>Kitchen note</b>${o.notes}</div>` : ""}
        <div class="ticket-foot">
          <label class="toggle" title="${completed ? "Move back to active" : "Mark as picked up / completed"}">
            <input type="checkbox" class="complete-toggle" data-idx="${idx}" ${completed ? "checked" : ""}>
            <span class="track"></span>
            <span class="tlabel">${completed ? "Completed" : "Mark complete"}</span>
          </label>
        </div>
      </article>
    `;
  }

  function wireToggles(gridEl, list) {
    gridEl.querySelectorAll(".complete-toggle").forEach(input => {
      input.addEventListener("change", () => {
        toggleCompleted(list[Number(input.dataset.idx)]);
        renderOrders();
        renderStats();
        renderPrep();
      });
    });
  }

  function renderOrders() {
    const sorted = ordersByPickup(ORDERS);
    const groups = computeTimeGroups(sorted);
    const active = sorted.filter(o => !isCompleted(o));
    const completed = sorted.filter(o => isCompleted(o));

    const gridActive = document.getElementById("orderGridActive");
    const gridCompleted = document.getElementById("orderGridCompleted");

    gridActive.innerHTML = active.length
      ? active.map((o, idx) => renderTicket(o, idx, groups)).join("")
      : `<div class="empty-state">All caught up — no active orders right now.</div>`;

    gridCompleted.innerHTML = completed.length
      ? completed.map((o, idx) => renderTicket(o, idx, groups)).join("")
      : `<div class="empty-state">No completed orders yet.</div>`;

    wireToggles(gridActive, active);
    wireToggles(gridCompleted, completed);

    subtabActive.textContent = `Active Orders (${active.length})`;
    subtabCompleted.textContent = `Completed Orders (${completed.length})`;
  }

  // ---- Prep by day view ----
  // Only counts orders that haven't been marked complete yet — once
  // something's picked up, it should drop off the "still need to prep" list.
  function renderPrep() {
    const byDay = {};
    for (const o of ORDERS.filter(o => !isCompleted(o))) {
      (byDay[o.pickupDate] ||= []).push(o);
    }
    const days = Object.keys(byDay).sort();
    const el = document.getElementById("prepList");
    if (!days.length) {
      el.innerHTML = `<div class="empty-state">Nothing left to prep — every order's been completed.</div>`;
      return;
    }
    el.innerHTML = days.map(day => {
      const orders = byDay[day].slice().sort((a, b) => timeToMinutes(a.pickupTime) - timeToMinutes(b.pickupTime));
      const tally = {};
      for (const o of orders) {
        for (const i of o.items) {
          tally[i.name] = (tally[i.name] || 0) + i.qty;
        }
      }
      const tallyEntries = Object.entries(tally).sort((a, b) => b[1] - a[1]);

      let dayPersonal = 0, dayShareable = 0;
      for (const o of orders) {
        const t = trayPortions(o.items);
        dayPersonal += t.personal;
        dayShareable += t.shareable;
      }
      const dayPortions = dayPersonal * 1 + dayShareable * 3;
      const trayBits = [];
      if (dayPersonal) trayBits.push(`${dayPersonal} personal tray${dayPersonal === 1 ? "" : "s"}`);
      if (dayShareable) trayBits.push(`${dayShareable} shareable tray${dayShareable === 1 ? "" : "s"} (×3)`);

      return `
        <div class="day-block">
          <div class="day-head">
            <div class="date">${fmtDate(day)}</div>
            <div class="right">
              <div class="count">${orders.length} order${orders.length === 1 ? "" : "s"} · ${fmtMoney(orders.reduce((s, o) => s + o.total, 0))}${trayBits.length ? ` · ${trayBits.join(", ")}` : ""}</div>
              <div class="portions-badge"><div class="n">${dayPortions}</div><div class="l">Portions to prep</div></div>
            </div>
          </div>
          <div class="tally">
            ${tallyEntries.map(([name, qty]) => `
              <div class="tally-item"><span class="qty">${qty}</span><span class="name">${name}</span></div>
            `).join("")}
          </div>
          <div class="roster">
            ${orders.map(o => `
              <div class="roster-row">
                <span class="who">${o.name}</span>
                <span class="what">${o.items.map(i => `${i.qty}× ${i.name}`).join(", ")}</span>
                <span class="time">${o.pickupTime}</span>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }).join("");
  }

  // ---- Tabs ----
  const tabOrders = document.getElementById("tab-orders");
  const tabPrep = document.getElementById("tab-prep");
  const viewOrders = document.getElementById("view-orders");
  const viewPrep = document.getElementById("view-prep");

  function activate(tab) {
    const isOrders = tab === "orders";
    tabOrders.setAttribute("aria-selected", String(isOrders));
    tabPrep.setAttribute("aria-selected", String(!isOrders));
    viewOrders.hidden = !isOrders;
    viewPrep.hidden = isOrders;
  }
  tabOrders.addEventListener("click", () => activate("orders"));
  tabPrep.addEventListener("click", () => activate("prep"));

  // ---- Orders / Completed subtabs ----
  const subtabActive = document.getElementById("subtab-active");
  const subtabCompleted = document.getElementById("subtab-completed");
  const gridActiveEl = document.getElementById("orderGridActive");
  const gridCompletedEl = document.getElementById("orderGridCompleted");

  function activateSub(which) {
    const isActive = which === "active";
    subtabActive.setAttribute("aria-selected", String(isActive));
    subtabCompleted.setAttribute("aria-selected", String(!isActive));
    gridActiveEl.hidden = !isActive;
    gridCompletedEl.hidden = isActive;
  }
  subtabActive.addEventListener("click", () => activateSub("active"));
  subtabCompleted.addEventListener("click", () => activateSub("completed"));

  renderStats();
  renderOrders();
  renderPrep();
</script>
